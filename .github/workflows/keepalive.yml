name: keepalive
on:
  schedule:
    - cron: "17 3 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (read-only) until 31 Dec 2026
        run: |
          if [ "$(date -u +%Y%m%d)" -gt 20261231 ]; then echo "Past end date, skipping"; exit 0; fi
          code=$(curl -s -o /tmp/out -w "%{http_code}" -X POST \
            "https://agvulcqmltntviyflfim.supabase.co/rest/v1/rpc/list_taken_seats" \
            -H "apikey: sb_publishable_2yZqUCds-S1EkUh-Wjpu3A_X2O3IsOY" \
            -H "Content-Type: application/json" -d '{}')
          echo "HTTP $code"; head -c 200 /tmp/out
          [ "$code" = "200" ]
